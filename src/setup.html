<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impressoras — MaximusHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117; color: #e8eaf0; padding: 24px; font-size: 14px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #7a8196; margin-bottom: 24px; }
    .card {
      background: #1a1e2a; border-radius: 10px; border: 1px solid #252a38; overflow: hidden;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; border-bottom: 1px solid #252a38;
    }
    .card-title { font-size: 13px; font-weight: 600; color: #9aa3b5; text-transform: uppercase; letter-spacing: .05em; }
    .btn-sm {
      padding: 5px 12px; background: #4f8ef7; color: #fff; border: none;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-sm:hover { background: #3a78e8; }
    .btn-sm.secondary { background: #252a38; color: #9aa3b5; }
    .btn-sm.secondary:hover { background: #2e3447; color: #e8eaf0; }
    .printer-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-bottom: 1px solid #1e222e;
    }
    .printer-row:last-child { border-bottom: none; }
    .printer-icon { font-size: 20px; flex-shrink: 0; }
    .printer-info { flex: 1; min-width: 0; }
    .printer-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .printer-type { font-size: 11px; color: #7a8196; margin-top: 2px; }
    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600;
    }
    .badge.zpl  { background: #1a2e4a; color: #4f8ef7; }
    .badge.pdf  { background: #1a2e2a; color: #34d399; }
    .badge.auto { background: #2a2a1a; color: #f59e0b; }
    .toggle {
      width: 36px; height: 20px; background: #252a38; border-radius: 10px;
      position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0;
      border: none; outline: none;
    }
    .toggle.on { background: #4f8ef7; }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; background: #fff; border-radius: 50%;
      transition: transform .2s;
    }
    .toggle.on::after { transform: translateX(16px); }
    .empty { padding: 32px 16px; text-align: center; color: #4a5166; font-size: 13px; }
    /* O compartilhamento era um switch sem rótulo no canto da linha: quem
       instalava o client não descobria que faltava esse passo, e no Hub a
       lista de impressoras aparecia vazia sem explicação. */
    .share-box { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
    .share-label { font-size: 10px; color: #7a8196; white-space: nowrap; }
    .aviso-share {
      display: flex; gap: 8px; align-items: flex-start;
      background: #2a2113; border: 1px solid #4a3a17; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 14px; font-size: 12px; color: #e8c37a;
    }
    .footer { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
    .loading { text-align: center; padding: 32px; color: #4a5166; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.1); border-top-color: #4f8ef7;
      border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      background: #1a1e2a; border: 1px solid #252a38; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 20px; font-size: 12px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.online  { background: #34d399; box-shadow: 0 0 6px #34d399; }
    .status-dot.offline { background: #6b7280; }
    .config-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .btn-test {
      background: #252a38; color: #9aa3b5; border: 1px solid #2e3447;
      border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer;
      white-space: nowrap;
    }
    .btn-test:hover { background: #2e3447; color: #e8eaf0; }
    .btn-test:disabled { opacity: .6; cursor: default; }
    .config-row input {
      background: #0f1117; border: 1px solid #2e3447; border-radius: 5px;
      padding: 4px 8px; color: #e8eaf0; font-size: 12px; width: 140px; outline: none;
    }
    .config-row input:focus { border-color: #4f8ef7; }
    .config-label { font-size: 11px; color: #7a8196; min-width: 60px; }
    select {
      background: #0f1117; border: 1px solid #2e3447; border-radius: 5px;
      padding: 4px 8px; color: #e8eaf0; font-size: 12px; outline: none;
    }
    select:focus { border-color: #4f8ef7; }
  </style>
</head>
<body>
  <h1>Impressoras</h1>
  <p class="sub">Escolha quais impressoras estarão disponíveis no MaximusHub.</p>

  <div class="status-bar" id="status-bar">
    <div class="status-dot offline" id="status-dot"></div>
    <span id="status-text">Verificando conexão...</span>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Impressoras neste PC</span>
      <button class="btn-sm secondary" onclick="recarregar()"><span id="sync-icon">↻</span> Atualizar</button>
    </div>
    <div id="aviso-share" style="display:none"></div>
    <div id="lista"><div class="loading"><span class="spinner"></span></div></div>
  </div>

  <div class="footer">
    <button class="btn-sm secondary" onclick="window.hub.logout()">Sair da conta</button>
    <button class="btn-sm" id="btn-salvar" onclick="salvar()">Salvar</button>
  </div>

  <script>
    let impressoras = []
    let hubPrinters = []
    let agentUuid   = ''
    let escalaMap   = {}

    async function init () {
      agentUuid  = await window.hub.getStore('agent_uuid') || ''
      hubPrinters = await window.hub.getHubPrinters()
      escalaMap   = await window.hub.getPdfScaleMap() || {}
      await recarregar()
      await atualizarStatus()
    }

    async function recarregar () {
      document.getElementById('lista').innerHTML = '<div class="loading"><span class="spinner"></span></div>'
      impressoras = await window.hub.getPrinters()
      renderLista()
    }

    function renderLista () {
      const lista = document.getElementById('lista')
      if (!impressoras.length) {
        lista.innerHTML = '<div class="empty">Nenhuma impressora encontrada neste PC.</div>'
        return
      }

      lista.innerHTML = impressoras.map((p, i) => {
        const hub  = hubPrinters.find(h => h.system_name === p.system_name) || {}
        const shared = hub.is_shared || false
        const type   = hub.type || p.type || 'auto'
        const zplHost = hub.zpl_host || ''
        const zplPort = hub.zpl_port || 9100
        const escalaCfg = escalaMap[p.system_name]
        const escala = typeof escalaCfg === 'string' ? escalaCfg : (escalaCfg?.mode || 'label')
        const escalaPct = (typeof escalaCfg === 'object' && escalaCfg?.pct) || 100

        return `
          <div class="printer-row" id="row-${i}">
            <div class="printer-icon">${type === 'zpl' ? '🏷️' : type === 'pdf' ? '📄' : '🖨️'}</div>
            <div class="printer-info">
              <div class="printer-name" title="${p.system_name}">${p.system_name}</div>
              <div class="printer-type">
                <span class="badge ${type}">${type.toUpperCase()}</span>
              </div>
              <div class="config-row" style="margin-top:8px">
                <span class="config-label">Tipo:</span>
                <select id="type-${i}" onchange="atualizarTipo(${i}, this.value)">
                  <option value="auto"  ${type==='auto'?'selected':''}>Auto</option>
                  <option value="pdf"   ${type==='pdf'?'selected':''}>PDF</option>
                  <option value="zpl"   ${type==='zpl'?'selected':''}>ZPL</option>
                </select>
              </div>
              <div class="config-row" id="zpl-config-${i}" style="${type!=='zpl'?'display:none':''}">
                <span class="config-label">IP Zebra:</span>
                <input id="zpl-host-${i}" placeholder="192.168.1.100" value="${zplHost}"
                       onchange="impressoras[${i}]._zpl_host=this.value" />
                <input id="zpl-port-${i}" placeholder="9100" value="${zplPort}" style="width:70px"
                       onchange="impressoras[${i}]._zpl_port=this.value" />
              </div>
              <div class="config-row" id="escala-config-${i}" style="${type==='zpl'?'display:none':''}">
                <span class="config-label">Escala PDF:</span>
                <select id="escala-${i}" onchange="atualizarEscala(${i}, this.value)">
                  <option value="label"   ${escala==='label'?'selected':''}>Etiqueta 100×150 (recomendado)</option>
                  <option value="custom"  ${escala==='custom'?'selected':''}>Escala manual (%)</option>
                  <option value="auto"    ${escala==='auto'?'selected':''}>Automático (detectar)</option>
                  <option value="noscale" ${escala==='noscale'?'selected':''}>100% (tamanho real do PDF)</option>
                  <option value="shrink"  ${escala==='shrink'?'selected':''}>Reduzir p/ caber</option>
                  <option value="fit"     ${escala==='fit'?'selected':''}>Ajustar à página do driver</option>
                </select>
                <input id="escala-pct-${i}" type="number" min="50" max="300" step="5" value="${escalaPct}"
                       style="width:62px; ${escala==='custom'?'':'display:none'}"
                       onchange="atualizarEscala(${i}, 'custom')" title="Porcentagem da escala (50-300%)" />
                <button class="btn-test" id="btn-test-${i}" onclick="imprimirTeste(${i})"
                        title="Imprime etiqueta de teste com a configuração atual">🖨 Teste</button>
              </div>
            </div>
            <div class="share-box">
              <span class="share-label" id="share-label-${i}">${shared ? 'Compartilhada' : 'Compartilhar'}</span>
              <button class="toggle ${shared ? 'on' : ''}" id="toggle-${i}"
                      onclick="alternarCompartilhar(${i}, this)"
                      title="${shared ? 'Compartilhada com o Hub' : 'Ligue para o Hub enxergar esta impressora'}"></button>
            </div>
          </div>
        `
      }).join('')

      // Salva referências de estado na memória JS
      impressoras.forEach((p, i) => {
        const hub = hubPrinters.find(h => h.system_name === p.system_name) || {}
        p._shared   = hub.is_shared || false
        p._type     = hub.type     || p.type || 'auto'
        p._zpl_host = hub.zpl_host || ''
        p._zpl_port = hub.zpl_port || 9100
        p._hub_id   = hub.id
        p._agent_uuid = agentUuid
      })

      atualizarAvisoShare()
    }

    /**
     * Sem nenhuma impressora compartilhada, o Hub mostra "Nenhuma impressora
     * disponível" e o operador não tem como adivinhar que o passo que falta
     * está AQUI, neste PC. O aviso fecha essa distância.
     */
    function atualizarAvisoShare () {
      const caixa = document.getElementById('aviso-share')
      if (!caixa) return
      const algumaCompartilhada = impressoras.some(p => p._shared)
      if (algumaCompartilhada || impressoras.length === 0) {
        caixa.style.display = 'none'
        return
      }
      caixa.className = 'aviso-share'
      caixa.style.display = 'flex'
      caixa.innerHTML = '<span>⚠️</span><span>Nenhuma impressora está compartilhada. '
        + 'Enquanto isso, o MaximusHub mostra a lista de impressoras vazia na hora de imprimir. '
        + 'Ligue <b>Compartilhar</b> na impressora que a expedição usa — e, se for Zebra, escolha o tipo <b>ZPL</b>.</span>'
    }

    function alternarCompartilhar (i, btn) {
      impressoras[i]._shared = !impressoras[i]._shared
      btn.classList.toggle('on', impressoras[i]._shared)
      const rotulo = document.getElementById(`share-label-${i}`)
      if (rotulo) rotulo.textContent = impressoras[i]._shared ? 'Compartilhada' : 'Compartilhar'
      atualizarAvisoShare()
    }

    function atualizarTipo (i, valor) {
      impressoras[i]._type = valor
      const zplConfig = document.getElementById(`zpl-config-${i}`)
      zplConfig.style.display = valor === 'zpl' ? '' : 'none'
      const escalaConfig = document.getElementById(`escala-config-${i}`)
      if (escalaConfig) escalaConfig.style.display = valor === 'zpl' ? 'none' : ''
      const row = document.getElementById(`row-${i}`)
      const badge = row.querySelector('.badge')
      badge.className = `badge ${valor}`
      badge.textContent = valor.toUpperCase()
    }

    async function atualizarEscala (i, valor) {
      const nome = impressoras[i].system_name
      const pctInput = document.getElementById(`escala-pct-${i}`)
      // Mostra o campo % só no modo custom
      if (pctInput) pctInput.style.display = valor === 'custom' ? '' : 'none'
      const pct = pctInput ? parseInt(pctInput.value) || 100 : 100
      escalaMap = await window.hub.setPdfScale({ printer: nome, scale: valor, pct }) || escalaMap
    }

    async function imprimirTeste (i) {
      const nome = impressoras[i].system_name
      const btn = document.getElementById(`btn-test-${i}`)
      btn.disabled = true
      btn.textContent = '...'
      try {
        const r = await window.hub.printTestLabel({ printer: nome })
        btn.textContent = r.success ? '✓ Enviado' : '✗ Erro'
        if (!r.success) console.error('Teste falhou:', r.message)
      } catch (e) {
        btn.textContent = '✗ Erro'
      }
      setTimeout(() => { btn.disabled = false; btn.textContent = '🖨 Teste' }, 2500)
    }

    async function salvar () {
      const btnSalvar = document.getElementById('btn-salvar')
      btnSalvar.disabled = true
      btnSalvar.textContent = 'Salvando...'

      try {
        // 1. Sincroniza impressoras com o backend — já retorna lista completa com IDs
        const sync = await window.hub.syncPrinters()
        if (!sync.success) throw new Error(sync.message || 'Falha ao sincronizar com o servidor')

        hubPrinters = sync.data  // já temos os IDs — sem chamada extra

        // 2. Mapeia IDs do backend para cada impressora local
        impressoras.forEach(p => {
          const hub = hubPrinters.find(h => h.system_name === p.system_name) || {}
          if (hub.id) p._hub_id = hub.id
        })

        // 3. Aplica configurações do usuário em cada impressora
        for (const p of impressoras) {
          if (!p._hub_id) continue
          await window.hub.updatePrinter({
            agentUuid,
            printerId: p._hub_id,
            data: {
              is_shared:    p._shared,
              type:         p._type,
              display_name: p.system_name,
              zpl_host:     p._zpl_host || null,
              zpl_port:     parseInt(p._zpl_port) || 9100,
            },
          })
        }

        // 4. Recarrega do backend para confirmar e re-renderiza
        hubPrinters = await window.hub.getHubPrinters()
        renderLista()

        btnSalvar.textContent = '✓ Salvo!'
        setTimeout(() => { btnSalvar.textContent = 'Salvar'; btnSalvar.disabled = false }, 2000)
        return

      } catch (err) {
        alert('Erro ao salvar: ' + err.message)
        btnSalvar.textContent = 'Salvar'
        btnSalvar.disabled = false
      }
    }

    async function atualizarStatus () {
      const userId    = await window.hub.getStore('user_id')
      const userName  = await window.hub.getStore('user_name')
      const dot  = document.getElementById('status-dot')
      const text = document.getElementById('status-text')
      dot.className  = 'status-dot online'
      text.textContent = `Conectado como ${userName || userId || 'usuário'}`
    }

    init()
  </script>
</body>
</html>
